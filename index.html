<head>
<meta charset="utf-8">

<title>UNITY教科書</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--ink:#182235;--muted:#68758a;--line:#e4e9f1;--accent:#6658e8;--accent2:#8b7ff5;--nav:#111827;--soft:#f0efff;--green:#16845b;--shadow:0 12px 32px rgba(27,39,68,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
button,input{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}
.sidebar{background:var(--nav);color:#fff;padding:26px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:24px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#8b7ff5,#5445d8);display:grid;place-items:center;font-size:22px;font-weight:800}.brand b{font-size:18px;letter-spacing:.02em}.brand small{display:block;color:#aab4c6;font-size:11px;margin-top:3px}
.navlabel{color:#8792a7;font-size:10px;font-weight:800;letter-spacing:.14em;padding:0 10px;margin-bottom:7px}
.nav button{width:100%;border:0;background:transparent;color:#cbd3e1;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer;display:flex;gap:11px;align-items:center;margin:3px 0;font-size:13px}
.nav button.active,.nav button:hover{background:#252f43;color:#fff}.nav .ico{width:20px;text-align:center;font-size:16px}.sidefoot{margin-top:auto;color:#8591a6;font-size:11px;line-height:1.7;padding:0 9px}
.main{min-width:0}.topbar{height:72px;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:5}
.crumb{font-size:13px;color:var(--muted)}.crumb b{color:var(--ink)}.topright{display:flex;align-items:center;gap:12px}.search{width:min(330px,36vw);position:relative}.search input{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 13px 10px 36px;background:#fafbfe;outline:none}.search input:focus{border-color:var(--accent)}.search span{position:absolute;left:12px;top:9px;color:#8490a4}
.content{max-width:1180px;margin:auto;padding:32px 36px 70px}.welcome{background:linear-gradient(115deg,#242044,#5147a8 62%,#8075e9);color:#fff;border-radius:22px;padding:30px 34px;position:relative;overflow:hidden;box-shadow:var(--shadow)}.welcome:after{content:"{}";position:absolute;right:45px;top:4px;font-size:150px;font-weight:900;color:#ffffff12;letter-spacing:-.12em}.eyebrow{font-size:11px;letter-spacing:.15em;color:#d6d2ff;font-weight:800}.welcome h1{font-size:30px;margin:10px 0 8px}.welcome p{color:#e2e0ff;max-width:620px;font-size:13px;line-height:1.8;margin:0}.stats{display:flex;gap:30px;margin-top:22px}.stat strong{font-size:22px;display:block}.stat span{font-size:11px;color:#d6d2ff}
.sectionhead{display:flex;justify-content:space-between;align-items:end;margin:30px 0 15px}.sectionhead h2{font-size:18px;margin:0}.sectionhead p{margin:5px 0 0;color:var(--muted);font-size:12px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:0 3px 12px #1b274408;cursor:pointer;transition:.18s}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#c9c3ff}.cardicon{width:38px;height:38px;border-radius:11px;background:var(--soft);display:grid;place-items:center;font-size:18px;margin-bottom:13px}.card h3{font-size:14px;margin:0 0 7px}.card p{font-size:11px;line-height:1.7;color:var(--muted);margin:0}.tag{display:inline-block;background:#f1f3f8;color:#647087;padding:4px 8px;border-radius:20px;font-size:10px;margin-top:13px}
.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:22px;margin-top:20px}.panel h2{font-size:17px;margin:0 0 15px}.recent{display:flex;gap:13px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.recent:first-of-type{border-top:0}.recent .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}.recent b{font-size:12px}.recent small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.pagehead{margin-bottom:20px}.pagehead h1{font-size:25px;margin:0 0 7px}.pagehead p{font-size:13px;color:var(--muted);margin:0;line-height:1.7}
.lessonlist{display:grid;gap:12px}.lesson{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}.lesson h3{font-size:15px;margin:0 0 9px}.lesson p,.lesson li{font-size:13px;line-height:1.85;color:#48556b}.lesson ul{padding-left:20px}.lesson code{background:#f1f2f8;padding:2px 5px;border-radius:5px;font-family:ui-monospace,Consolas,monospace}
pre{background:#151c2b;color:#e6ebf5;padding:16px;border-radius:11px;overflow:auto;font-size:12px;line-height:1.7;position:relative}pre code{background:none!important;padding:0!important;color:inherit}.copy{border:1px solid #ffffff33;background:#ffffff12;color:#fff;border-radius:7px;padding:5px 9px;font-size:10px;float:right;cursor:pointer}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.pill{border:1px solid var(--line);background:#fff;color:#59667b;padding:8px 12px;border-radius:30px;font-size:11px;cursor:pointer}.pill.active{background:var(--soft);border-color:#c9c3ff;color:#5044c8}
.empty{color:var(--muted);font-size:13px;padding:28px;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:14px}
.footer{text-align:center;color:#9aa4b5;font-size:10px;margin-top:35px}
.mobilebrand{display:none}
.cloudbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;margin:18px 0 0}.cloudbar input{min-width:180px;flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:12px}.cloudbar button{border:0;border-radius:8px;background:var(--accent);color:#fff;padding:9px 12px;font-size:11px;cursor:pointer}.cloudbar button.secondary{background:#eef0f7;color:#39445a}.cloudstatus{width:100%;font-size:11px;color:var(--muted)}
@media(max-width:850px){.app{grid-template-columns:1fr}.sidebar{height:auto;position:sticky;top:0;z-index:8;padding:10px 13px;gap:8px}.brand{padding:0 5px}.logo{width:34px;height:34px}.brand b{font-size:15px}.brand small{display:none}.nav{display:flex;overflow:auto;gap:4px}.navlabel,.sidefoot{display:none}.nav button{white-space:nowrap;width:auto;padding:8px 10px;font-size:11px;margin:0}.nav .ico{width:auto}.topbar{height:58px;padding:0 16px}.crumb{display:none}.search{width:min(100%,290px)}.content{padding:20px 15px 55px}.welcome{padding:24px 21px}.welcome h1{font-size:24px}.welcome:after{right:8px;font-size:100px}.stats{gap:20px}.cards{grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:15px}.sectionhead{margin-top:23px}}
@media(max-width:480px){.cards{grid-template-columns:1fr}.welcome p{max-width:95%}.stats{gap:15px}.stat strong{font-size:19px}.topright{width:100%}.search{width:100%}}
</style>

<script>
const lessons = [
{ id:"variables",page:"basics",title:"変数・データ型",desc:"値を保存するための入れ物",tags:["C#","基本"],body:`<p>変数は、数値や文字などのデータを保存するための入れ物。</p><ul><li><code>int</code>：整数</li><li><code>float</code>：小数</li><li><code>string</code>：文字列</li><li><code>bool</code>：true / false</li><li><code>GameObject</code>：ゲームオブジェクト</li><li><code>Vector3</code>：X・Y・Zの3次元データ</li></ul><pre><button class="copy">コピー</button><code>int score = 0;\nfloat speed = 5.0f;\nstring playerName = "Player";\nbool isJumping = false;</code></pre>`},
{ id:"methods",page:"basics",title:"メソッド・処理の分割",desc:"処理を名前のついたまとまりにする",tags:["C#","メソッド"],body:`<p>メソッドは、複数の処理をひとまとめにしたもの。Update()に全部書かず、Move()やSpawnBomb()などに分けると読みやすくなる。</p><pre><button class="copy">コピー</button><code>void Update()\n{\n    Move();\n    SpawnBomb();\n}\n\nvoid Move()\n{\n    // 移動処理\n}</code></pre><p><code>return;</code> は、そのメソッドの処理を終了する。</p>`},
{ id:"conditions",page:"basics",title:"if・比較演算子",desc:"条件によって処理を分ける",tags:["C#","条件分岐"],body:`<pre><button class="copy">コピー</button><code>if (bombCount > 0)\n{\n    // 爆弾が残っている場合\n}</code></pre><ul><li><code>=</code>：代入</li><li><code>==</code>：等しいか比較</li><li><code>!=</code>：等しくない</li><li><code>&gt;</code>：より大きい</li><li><code>&amp;&amp;</code>：両方の条件を満たす（AND）</li><li><code>||</code>：どちらかの条件を満たす（OR）</li></ul>`},
{ id:"arrays",page:"arrays",title:"1次元配列",desc:"同じ種類のデータを複数保存する",tags:["配列","C#"],body:`<pre><button class="copy">コピー</button><code>int[] hp = new int[3];\nhp[0] = 100;\nhp[1] = 80;\nhp[2] = 60;\n\nDebug.Log(hp[1]);</code></pre><p>配列の番号（添字）は0から始まる。<code>Length</code>で要素数を取得できる。</p>`},
{ id:"array2",page:"arrays",title:"2次元配列",desc:"行と列でマスの状態などを管理する",tags:["配列","マップ"],body:`<pre><button class="copy">コピー</button><code>int[,] stageStatus = new int[15, 13];\n\n// 0行0列のマスを1にする\nstageStatus[0, 0] = 1;\n\n// 行数と列数\nint rows = stageStatus.GetLength(0);\nint columns = stageStatus.GetLength(1);</code></pre><p><code>配列[行, 列]</code>の順番。int型配列の初期値は0。15行13列なら添字は行0～14、列0～12。</p>`},
{ id:"loops",page:"arrays",title:"for文・while文",desc:"同じ処理を繰り返す",tags:["繰り返し","C#"],body:`<pre><button class="copy">コピー</button><code>for (int i = 0; i < 5; i++)\n{\n    Debug.Log(i);\n}</code></pre><p>0から4まで表示する。<code>i++</code>は1増やす、<code>i--</code>は1減らす、<code>i += 2</code>は2増やす。</p><p>二重for文は、2次元配列の行と列を順番に処理するときに使える。</p>`},
{ id:"vectors",page:"movement",title:"Vector2・Vector3",desc:"位置や方向を表す",tags:["座標","移動"],body:`<ul><li><code>Vector2</code>：X・Yの2次元</li><li><code>Vector3</code>：X・Y・Zの3次元</li><li><code>Vector3.zero</code>：(0, 0, 0)</li><li><code>Vector3.right</code>：右方向</li><li><code>Vector3.left</code>：左方向</li><li><code>Vector3.forward</code>：前方向</li><li><code>Vector3.back</code>：後ろ方向</li></ul><pre><button class="copy">コピー</button><code>Vector3 pos = new Vector3(2, 0, 3);</code></pre>`},
{ id:"round",page:"movement",title:"Mathf.Round・normalized",desc:"座標の四捨五入と方向の正規化",tags:["座標","数学"],body:`<pre><button class="copy">コピー</button><code>Mathf.Round(transform.position.x)\n\ncc.SimpleMove(move.normalized * speed);</code></pre><p><code>Mathf.Round()</code>は四捨五入。<code>normalized</code>はベクトルの長さを1にして方向を保つ。斜め移動が速くなりすぎるのを防ぐために使える。</p>`},
{ id:"input",page:"movement",title:"Input System",desc:"キーボード入力を取得する",tags:["入力","キーボード"],body:`<pre><button class="copy">コピー</button><code>using UnityEngine.InputSystem;\n\nif (Keyboard.current.spaceKey.wasPressedThisFrame)\n{\n    // 押した瞬間だけ実行\n}\n\nif (Keyboard.current.rightArrowKey.isPressed)\n{\n    // 押している間実行\n}</code></pre><p><code>wasPressedThisFrame</code>は押した瞬間、<code>isPressed</code>は押している間。</p>`},
{ id:"character",page:"movement",title:"CharacterController",desc:"SimpleMoveでプレイヤーを移動",tags:["移動","コンポーネント"],body:`<pre><button class="copy">コピー</button><code>CharacterController cc;\n\nvoid Start()\n{\n    cc = GetComponent&lt;CharacterController&gt;();\n}\n\nvoid Move()\n{\n    Vector3 move = Vector3.zero;\n    move += Vector3.right;\n    cc.SimpleMove(move.normalized * speed);\n}</code></pre><p><code>GetComponent&lt;CharacterController&gt;()</code>で同じGameObjectに付いているコンポーネントを取得する。</p>`},
{ id:"instantiate",page:"objects",title:"Instantiate・Destroy",desc:"オブジェクトを生成・削除する",tags:["Prefab","生成"],body:`<pre><button class="copy">コピー</button><code>GameObject bomb = Instantiate(\n    BombPrefab,\n    bombPos,\n    Quaternion.identity\n);\n\nDestroy(bomb, 3.0f);</code></pre><p><code>Instantiate()</code>はPrefabなどからオブジェクトを生成する。<code>Destroy(bomb, 3.0f)</code>はbombを3秒後に削除する。<code>Quaternion.identity</code>は回転なし。</p>`},
{ id:"random",page:"objects",title:"Random.Range・Time.deltaTime",desc:"ランダム値と経過時間",tags:["生成","時間"],body:`<pre><button class="copy">コピー</button><code>int n = Random.Range(0, 5);\ndelta += Time.deltaTime;</code></pre><p>整数版Random.Rangeは最小値以上・最大値未満。Time.deltaTimeは前フレームからの経過時間（秒）。</p>`},
{ id:"bomb",page:"game",title:"爆弾設置・マス管理",desc:"2次元配列で爆弾の有無を記録",tags:["実践","2次元配列"],body:`<pre><button class="copy">コピー</button><code>if (Keyboard.current.spaceKey.wasPressedThisFrame && bombCount > 0)\n{\n    Vector3 bombPos = new Vector3(\n        Mathf.Round(transform.position.x), 0,\n        Mathf.Round(transform.position.z)\n    );\n\n    if (stageStatus[(int)bombPos.x, (int)bombPos.z] == 0)\n    {\n        GameObject bomb = Instantiate(\n            BombPrefab, bombPos, Quaternion.identity\n        );\n        Destroy(bomb, 3.0f);\n        stageStatus[(int)bombPos.x, (int)bombPos.z] = 1;\n        bombCount--;\n    }\n}</code></pre><p>スペースキーを押し、爆弾が残っていて、対象マスが0なら生成する。設置したマスを1にし、所持数を1減らす。</p><p><b>注意：</b>爆弾が消えた後に該当マスを0へ戻す処理が別途必要。上の例のままでは配列が1のまま残る。また、ワールド座標をそのまま配列添字に使う場合、負数や配列範囲外に注意。</p>`},
{ id:"ui",page:"game",title:"UI・スコア・HP",desc:"画面表示やゲージを操作する",tags:["UI","ゲーム機能"],body:`<pre><button class="copy">コピー</button><code>hpGauge.GetComponent&lt;Image&gt;().fillAmount -= 0.1f;\nscoreText.text = score.ToString();</code></pre><p><code>Image.fillAmount</code>でゲージの表示量を変更できる。TextMeshProのtextに値を表示するときは<code>ToString()</code>で文字列に変換する。</p>`},
{ id:"scene",page:"game",title:"SceneManager",desc:"シーンを切り替える",tags:["シーン"],body:`<pre><button class="copy">コピー</button><code>using UnityEngine.SceneManagement;\n\nSceneManager.LoadScene("GameOver");</code></pre><p>指定した名前のシーンを読み込む。シーンがBuild Settings / Build Profilesの対象に含まれているか確認する。</p>`},
{ id:"collisions",page:"game",title:"当たり判定",desc:"Collision・Triggerの基本",tags:["物理","当たり判定"],body:`<pre><button class="copy">コピー</button><code>void OnCollisionEnter(Collision other)\n{\n    Debug.Log("接触した");\n}\n\nvoid OnTriggerEnter(Collider other)\n{\n    Debug.Log("Triggerに入った");\n}</code></pre><p>Collisionは物理的な接触、Triggerはすり抜ける判定に使う。2DではOnCollisionEnter2D / OnTriggerEnter2Dを使う。</p>`},
{ id:"debug",page:"scripts",title:"Debug.Log",desc:"Consoleに値やメッセージを表示",tags:["デバッグ"],body:`<pre><button class="copy">コピー</button><code>Debug.Log("Hello Unity");\nDebug.Log(bombCount);\nDebug.Log(stageStatus[1, 0]);</code></pre><p>UnityのConsoleに文字や変数の値を表示して、処理の確認に使う。</p>`},
{ id:"tooltip",page:"scripts",title:"Tooltip",desc:"Inspectorに説明を表示",tags:["Inspector"],body:`<pre><button class="copy">コピー</button><code>[Tooltip("プレイヤーの移動速度です")]\npublic float speed;</code></pre><p>Inspectorで変数にマウスを合わせたときに説明を表示できる。</p>`},
{ id:"generator",page:"scripts",title:"Generatorの基本",desc:"一定時間ごとにPrefabを生成",tags:["実践","生成"],body:`<pre><button class="copy">コピー</button><code>float delta = 0;\nfloat span = 2.0f;\n\nvoid Update()\n{\n    delta += Time.deltaTime;\n    if (delta > span)\n    {\n        delta = 0;\n        Instantiate(prefab);\n    }\n}</code></pre><p>deltaに経過時間を足し、spanを超えたら生成してdeltaをリセットする。</p>`}
];
const pageNames={home:"ホーム",basics:"C#基礎",arrays:"配列・繰り返し",movement:"移動・座標",objects:"オブジェクト",game:"ゲーム機能",scripts:"実践コード",glossary:"用語集",favorites:"お気に入り"};
const pageInfo={
basics:["C#基礎","プログラムを書くための基本ルール。変数・条件分岐・メソッドを整理。"],
arrays:["配列・繰り返し","データをまとめて管理し、同じ処理を繰り返す方法。"],
movement:["移動・座標","Vector3や入力処理を使ったプレイヤー操作。"],
objects:["オブジェクト","Prefabの生成、削除、時間やランダム処理。"],
game:["ゲーム機能","爆弾、UI、シーン、当たり判定などの実践内容。"],
scripts:["実践コード","Unity開発でよく使う補助的な書き方。"]
};
let current="home", query="";
let favorites=JSON.parse(localStorage.getItem("unityFavorites")||"[]");
function saveFav(){localStorage.setItem("unityFavorites",JSON.stringify(favorites))}
function home(){return `<section class="welcome"><div class="eyebrow">MY PERSONAL LEARNING LIBRARY</div><h1>UNITY教科書</h1><p>Unity・C#の学習内容を、自分のペースで整理する場所。基礎から実践コードまで、必要なときにすぐ見返せる。</p><div class="stats"><div class="stat"><strong>${lessons.length}</strong><span>学習ノート</span></div><div class="stat"><strong>${favorites.length}</strong><span>お気に入り</span></div><div class="stat"><strong>いつでも</strong><span>見返せる</span></div></div></section><div class="sectionhead"><div><h2>学習カテゴリー</h2><p>知りたい分野を選択</p></div></div><div class="cards">${Object.entries(pageInfo).map(([k,v])=>`<div class="card" data-goto="${k}"><div class="cardicon">${({basics:"▤",arrays:"▦",movement:"⌖",objects:"◇",game:"⚙",scripts:"⌘"})[k]}</div><h3>${v[0]}</h3><p>${v[1]}</p><span class="tag">${lessons.filter(x=>x.page===k).length} ノート</span></div>`).join("")}<div class="card" data-goto="glossary"><div class="cardicon">Ａ</div><h3>用語集</h3><p>Unity・C#で使う用語を短く確認。</p><span class="tag">基本用語</span></div></div><div class="panel"><h2>最近追加した学習内容</h2>${lessons.slice(-4).reverse().map(x=>`<div class="recent" data-open="${x.id}"><span class="dot"></span><div><b>${x.title}</b><small>${pageNames[x.page]} ・ ${x.desc}</small></div></div>`).join("")}</div>`}
function lessonCard(x){return `<article class="lesson" id="${x.id}"><div style="display:flex;justify-content:space-between;gap:12px;align-items:start"><div><h3>${x.title}</h3><div style="font-size:11px;color:#7a879a">${x.desc}</div></div><button class="pill fav" data-fav="${x.id}">${favorites.includes(x.id)?"★ 保存済み":"☆ 保存"}</button></div><div style="margin-top:15px">${x.body}</div><div>${x.tags.map(t=>`<span class="tag">${t}</span>`).join(" ")}</div></article>`}
function render(){document.getElementById("crumb").textContent=pageNames[current]||"検索結果";document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===current));let v=document.getElementById("view");if(current==="home"){v.innerHTML=home()}else if(current==="glossary"){let terms=[["MonoBehaviour","Unityのスクリプトで使う基本クラス"],["Start()","最初のフレーム更新前に一度呼ばれる"],["Update()","毎フレーム呼ばれる"],["Prefab","再利用できるGameObjectのひな形"],["Instantiate()","オブジェクトを生成する"],["Destroy()","オブジェクトを削除する"],["Vector3","X・Y・Zの値を持つ構造体"],["normalized","ベクトルの向きを保って長さを1にする"],["Time.deltaTime","前フレームからの経過時間"],["Quaternion.identity","回転なしを表す"]];v.innerHTML=`<div class="pagehead"><h1>用語集</h1><p>Unityでよく使う言葉を簡単に確認。</p></div><div class="lessonlist">${terms.map(t=>`<article class="lesson"><h3>${t[0]}</h3><p>${t[1]}</p></article>`).join("")}</div>`}else{let list=current==="favorites"?lessons.filter(x=>favorites.includes(x.id)):lessons.filter(x=>x.page===current);if(query.trim())list=lessons.filter(x=>(x.title+x.desc+x.tags.join(" ")+x.body.replace(/<[^>]*>/g,"")).toLowerCase().includes(query.toLowerCase()));let title=query?"検索結果":(pageInfo[current]?.[0]||"");let desc=query?`「${query}」に一致するノート`:(pageInfo[current]?.[1]||"");v.innerHTML=`<div class="pagehead"><h1>${title}</h1><p>${desc}</p></div><div class="lessonlist">${list.length?list.map(lessonCard).join(""):'<div class="empty">まだノートがありません。</div>'}</div>`}wire()}
function wire(){document.querySelectorAll("[data-goto]").forEach(e=>e.onclick=()=>go(e.dataset.goto));document.querySelectorAll("[data-open]").forEach(e=>e.onclick=()=>{let x=lessons.find(a=>a.id===e.dataset.open);go(x.page);setTimeout(()=>document.getElementById(x.id)?.scrollIntoView({behavior:"smooth"}),20)});document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>{let id=b.dataset.fav;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];saveFav();render()});document.querySelectorAll(".copy").forEach(b=>b.onclick=async()=>{let t=b.parentElement.querySelector("code").innerText;try{await navigator.clipboard.writeText(t);b.textContent="コピー済み"}catch{b.textContent="選択してコピー"}setTimeout(()=>b.textContent="コピー",1500)})}
function go(p){current=p;query="";document.getElementById("search").value="";render();window.scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.page));
document.getElementById("search").addEventListener("input",e=>{query=e.target.value;current="search";render()});

// Supabase接続設定（Publishable keyはブラウザで使える公開キー）
const SUPABASE_URL = "https://uaozuibmwaadtkihqwub.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_iLGcIQQlfOosnus64mHg6g_gSyb8SgC";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const authEmail = document.getElementById("authEmail");
const authPassword = document.getElementById("authPassword");
const cloudStatus = document.getElementById("cloudStatus");
const signInBtn = document.getElementById("signInBtn");
const signUpBtn = document.getElementById("signUpBtn");
const signOutBtn = document.getElementById("signOutBtn");
const syncBtn = document.getElementById("syncBtn");
const loadBtn = document.getElementById("loadBtn");
let loadedCloudIds = new Set();

function setCloudStatus(message) {
  cloudStatus.textContent = message;
}
function updateAuthUI(user) {
  const loggedIn = !!user;
  signInBtn.hidden = loggedIn;
  signUpBtn.hidden = loggedIn;
  signOutBtn.hidden = !loggedIn;
  syncBtn.hidden = !loggedIn;
  loadBtn.hidden = !loggedIn;
  authEmail.hidden = loggedIn;
  authPassword.hidden = loggedIn;
  setCloudStatus(loggedIn
    ? `${user.email} でログイン中。ノートをクラウドに保存できます。`
    : "未ログイン：ログインすると学習ノートをオンライン保存できます。");
}

signUpBtn.addEventListener("click", async () => {
  const email = authEmail.value.trim();
  const password = authPassword.value;
  if (!email || password.length < 8) {
    setCloudStatus("メールアドレスと8文字以上のパスワードを入力してください。");
    return;
  }
  signUpBtn.disabled = true;
  const { data, error } = await supabaseClient.auth.signUp({ email, password });
  signUpBtn.disabled = false;
  if (error) return setCloudStatus("新規登録エラー：" + error.message);
  if (data.session) {
    updateAuthUI(data.user);
  } else {
    setCloudStatus("確認メールを送信しました。メール内のリンクを開いて登録を完了してください。");
  }
});

signInBtn.addEventListener("click", async () => {
  const email = authEmail.value.trim();
  const password = authPassword.value;
  if (!email || !password) return setCloudStatus("メールアドレスとパスワードを入力してください。");
  signInBtn.disabled = true;
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  signInBtn.disabled = false;
  if (error) return setCloudStatus("ログインエラー：" + error.message);
  updateAuthUI(data.user);
  await loadCloudLessons();
});

signOutBtn.addEventListener("click", async () => {
  const { error } = await supabaseClient.auth.signOut();
  if (error) return setCloudStatus("ログアウトエラー：" + error.message);
  updateAuthUI(null);
});

async function loadCloudLessons() {
  const { data: authData, error: authError } = await supabaseClient.auth.getUser();
  if (authError || !authData.user) {
    return setCloudStatus("ログイン状態を確認できません。もう一度ログインしてください。");
  }

  loadBtn.disabled = true;
  setCloudStatus("クラウドのノートを読み込んでいます…");

  const { data, error } = await supabaseClient
    .from("unity_lessons")
    .select("id,title,category,content,code,created_at")
    .eq("user_id", authData.user.id)
    .order("created_at", { ascending: true });

  loadBtn.disabled = false;
  if (error) return setCloudStatus("読み込みエラー：" + error.message);

  let added = 0;
  for (const row of (data || [])) {
    const category = pageInfo[row.category] ? row.category : "scripts";
    const existingLocal = lessons.find(x => x.title === row.title && x.page === category);
    if (existingLocal) {
      // 既存の19件はそのまま維持し、クラウド上の追加ノートだけを新規表示する
      continue;
    }
    const cloudId = "cloud-" + row.id;
    if (loadedCloudIds.has(cloudId)) continue;
    lessons.push({
      id: cloudId,
      page: category,
      title: row.title || "タイトルなし",
      desc: "クラウドから読み込んだノート",
      tags: ["クラウド"],
      body: row.content || (row.code
        ? `<pre><code>${String(row.code).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}</code></pre>`
        : "<p>内容はまだありません。</p>")
    });
    loadedCloudIds.add(cloudId);
    added++;
  }

  render();
  setCloudStatus(`読み込み完了：クラウドのノート ${data?.length || 0} 件を確認しました。新しく表示したノートは ${added} 件です。`);
}

loadBtn.addEventListener("click", loadCloudLessons);

syncBtn.addEventListener("click", async () => {
  syncBtn.disabled = true;
  setCloudStatus("ノートを確認しています…");
  const { data: authData, error: authError } = await supabaseClient.auth.getUser();
  if (authError || !authData.user) {
    syncBtn.disabled = false;
    updateAuthUI(null);
    return setCloudStatus("ログイン状態を確認できません。もう一度ログインしてください。");
  }
  const user = authData.user;
  const { data: existing, error: readError } = await supabaseClient
    .from("unity_lessons")
    .select("id,title,category")
    .eq("user_id", user.id);
  if (readError) {
    syncBtn.disabled = false;
    return setCloudStatus("読み込みエラー：" + readError.message);
  }

  let added = 0;
  let updated = 0;
  for (const lesson of lessons) {
    const found = (existing || []).find(row => row.title === lesson.title && row.category === lesson.page);
    const record = {
      title: lesson.title,
      category: lesson.page,
      content: lesson.body,
      code: "",
      user_id: user.id
    };
    const result = found
      ? await supabaseClient.from("unity_lessons").update(record).eq("id", found.id).eq("user_id", user.id)
      : await supabaseClient.from("unity_lessons").insert(record);
    if (result.error) {
      syncBtn.disabled = false;
      return setCloudStatus("保存エラー：" + result.error.message + "（" + lesson.title + "）");
    }
    if (found) updated++; else added++;
  }
  syncBtn.disabled = false;
  setCloudStatus(`保存完了：新規 ${added} 件・更新 ${updated} 件。別のPCやスマホから同じアカウントでログインして利用できます。`);
});

supabaseClient.auth.getSession().then(async ({ data, error }) => {
  if (error) setCloudStatus("ログイン状態の確認に失敗しました：" + error.message);
  updateAuthUI(data?.session?.user || null);
  if (data?.session?.user) await loadCloudLessons();
});
supabaseClient.auth.onAuthStateChange((_event, session) => {
  updateAuthUI(session?.user || null);
});


render();
</script>
</body></html>
